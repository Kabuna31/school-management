services:
  - type: web
    name: school-management-system
    env: python
    buildCommand: |
      echo "=== Installing dependencies ==="
      pip install --upgrade pip
      pip install -r requirements.txt
      
      echo "=== Collecting static files ==="
      python manage.py collectstatic --noinput
      
      echo "=== Running migrations ==="
      python manage.py makemigrations
      python manage.py migrate --verbosity 3
      
      echo "=== Checking migration status ==="
      python manage.py showmigrations
      
      echo "=== Creating superuser ==="
      echo "from django.contrib.auth import get_user_model; User = get_user_model(); User.objects.create_superuser('admin', 'admin@school.com', 'admin123456') if not User.objects.filter(username='admin').exists() else None" | python manage.py shell
      
      echo "=== Build completed successfully ==="
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: school_db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "school-management-system.onrender.com,.onrender.com,localhost,127.0.0.1"
      - key: PYTHON_VERSION
        value: "3.11.0"

databases:
  - name: school_db
    databaseName: school_db
    user: school_user
    plan: free