services:
  - type: web
    name: school-management
    env: python
    plan: free
    buildCommand: >
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput
    startCommand: >
      python manage.py migrate --noinput &&
      python manage.py ensure_superuser &&
      gunicorn config.wsgi:application
      --workers 1
      --timeout 120
      --bind 0.0.0.0:$PORT
      --log-level info
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "school-management-cr57.onrender.com,.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: schoolms-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: SUPERUSER_USERNAME
        value: "admin"
      - key: SUPERUSER_EMAIL
        value: "admin@school.com"
      - key: SUPERUSER_PASSWORD
        value: "changeme123"

databases:
  - name: schoolms-db
    plan: free
