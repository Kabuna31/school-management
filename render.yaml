services:
  - type: web
    name: school-management-system
    env: python
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py makemigrations
      python manage.py migrate --verbosity 3
      python manage.py shell -c "from django.contrib.auth import get_user_model; from django.contrib.auth.hashers import make_password; User = get_user_model(); [setattr(u, 'password', make_password(u.username)) or u.save() for u in User.objects.all()]; print('All passwords set to username')"
      python setup_data.py
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: school_db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "school-management-system.onrender.com,.onrender.com,localhost,127.0.0.1"

databases:
  - name: school_db
    databaseName: school_db
    user: school_user
    plan: free